version: '3.8'

services:
  # Nginx service for reverse proxy
  nginx:
    image: nginx:alpine
    container_name: connect-aid-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - connect-aid-network

  # Backend service
  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    container_name: connect-aid-backend
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CURRENT_HOST=${CURRENT_HOST}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - ADDITIONAL_ORIGINS=${ADDITIONAL_ORIGINS}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://backend:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - connect-aid-network

  # Frontend service
  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
    container_name: connect-aid-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://frontend:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - connect-aid-network

  # Selenium E2E Tests (runs on demand)
  selenium-tests:
    build:
      context: ./tests/selenium
      dockerfile: Dockerfile
    container_name: connect-aid-selenium-tests
    environment:
      - NODE_ENV=test
      - CI=true
      - TEST_BASE_URL=http://nginx:80
    volumes:
      - ./tests/selenium/test-results:/app/test-results
      - ./tests/selenium/screenshots:/app/screenshots
    depends_on:
      nginx:
        condition: service_started
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - connect-aid-network
    profiles:
      - testing
    command: ["./run-tests.sh"]

networks:
  connect-aid-network:
    driver: bridge

volumes:
  uploads:
    driver: local
